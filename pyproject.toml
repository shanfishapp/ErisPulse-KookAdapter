[project]
name = "ErisPulse-KookAdapter"
version = "4.2.0"
description = "ErisPulse Kook Adapter - Kook平台适配器"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    {name = "ShanFish", email = "shanfishdev@qq.com"}
]
dependencies = []

[project.urls]
"homepage" = "https://github.com/shanfishapp/ErisPulse-KookAdapter"

[project.entry-points."erispulse.adapter"]
"kook" = "Kook:KookAdapter"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["Kook"]
